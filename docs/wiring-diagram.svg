<svg viewBox="0 0 1040 1010" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Schéma de câblage de la serre connectée : ESP32 relié au capteur d'humidité du sol sur GPIO34, au DHT22 sur GPIO18, à l'écran OLED I2C sur GPIO21 (SDA) et GPIO22 (SCL), et à la grille d'un MOSFET canal N sur GPIO33 via une résistance de 220 ohms avec pull-down de 10 kilo-ohms. Le MOSFET commute la pompe côté masse, avec une diode de roue libre en parallèle de la pompe.">
  <rect x="0" y="0" width="1040" height="1010" fill="#ffffff"/>

  <text x="520" y="34" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#1a1a1a">Schéma de câblage — Serre connectée (ESP32)</text>

  <!-- ESP32 box -->
  <rect x="40" y="200" width="220" height="420" rx="10" fill="#f8fafc" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="130" y="400" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#1a1a1a">ESP32 DevKit</text>
  <text x="130" y="422" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#495057">E/S logiques 3.3V</text>

  <!-- Capteur humidite du sol box -->
  <rect x="740" y="60" width="220" height="110" rx="10" fill="#f8fafc" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="850" y="110" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#1a1a1a">Capteur d'humidité</text>
  <text x="850" y="129" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#1a1a1a">du sol (capacitif)</text>

  <!-- DHT22 box -->
  <rect x="740" y="250" width="220" height="110" rx="10" fill="#f8fafc" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="850" y="300" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#1a1a1a">DHT22</text>
  <text x="850" y="319" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#495057">température / humidité air</text>
  <text x="850" y="378" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#495057">+ résistance pull-up 10kΩ entre DATA et 3V3</text>

  <!-- OLED box -->
  <rect x="740" y="420" width="220" height="120" rx="10" fill="#f8fafc" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="850" y="468" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#1a1a1a">Écran OLED 128×64</text>
  <text x="850" y="487" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#495057">SSD1306, I2C</text>
  <text x="850" y="504" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#495057">adresse 0x3C</text>

  <!-- ===== Bundle A : capteur sol ===== -->
  <line x1="260" y1="230" x2="740" y2="98" stroke="#c2410c" stroke-width="2"/>
  <line x1="260" y1="246" x2="740" y2="114" stroke="#495057" stroke-width="2"/>
  <line x1="260" y1="262" x2="740" y2="130" stroke="#1d4ed8" stroke-width="2"/>
  <circle cx="260" cy="230" r="4" fill="#c2410c"/>
  <circle cx="260" cy="246" r="4" fill="#495057"/>
  <circle cx="260" cy="262" r="4" fill="#1d4ed8"/>
  <circle cx="740" cy="98" r="4" fill="#c2410c"/>
  <circle cx="740" cy="114" r="4" fill="#495057"/>
  <circle cx="740" cy="130" r="4" fill="#1d4ed8"/>
  <text x="267" y="226" font-family="system-ui, sans-serif" font-size="12" fill="#c2410c">3V3</text>
  <text x="267" y="242" font-family="system-ui, sans-serif" font-size="12" fill="#495057">GND</text>
  <text x="267" y="258" font-family="system-ui, sans-serif" font-size="12" fill="#1d4ed8">GPIO34</text>
  <text x="733" y="94" text-anchor="end" font-family="system-ui, sans-serif" font-size="12" fill="#c2410c">VCC</text>
  <text x="733" y="110" text-anchor="end" font-family="system-ui, sans-serif" font-size="12" fill="#495057">GND</text>
  <text x="733" y="126" text-anchor="end" font-family="system-ui, sans-serif" font-size="12" fill="#1d4ed8">AOUT</text>

  <!-- ===== Bundle B : DHT22 ===== -->
  <line x1="260" y1="330" x2="740" y2="290" stroke="#c2410c" stroke-width="2"/>
  <line x1="260" y1="346" x2="740" y2="306" stroke="#495057" stroke-width="2"/>
  <line x1="260" y1="362" x2="740" y2="322" stroke="#1d4ed8" stroke-width="2"/>
  <circle cx="260" cy="330" r="4" fill="#c2410c"/>
  <circle cx="260" cy="346" r="4" fill="#495057"/>
  <circle cx="260" cy="362" r="4" fill="#1d4ed8"/>
  <circle cx="740" cy="290" r="4" fill="#c2410c"/>
  <circle cx="740" cy="306" r="4" fill="#495057"/>
  <circle cx="740" cy="322" r="4" fill="#1d4ed8"/>
  <text x="267" y="326" font-family="system-ui, sans-serif" font-size="12" fill="#c2410c">3V3</text>
  <text x="267" y="342" font-family="system-ui, sans-serif" font-size="12" fill="#495057">GND</text>
  <text x="267" y="358" font-family="system-ui, sans-serif" font-size="12" fill="#1d4ed8">GPIO18</text>
  <text x="733" y="286" text-anchor="end" font-family="system-ui, sans-serif" font-size="12" fill="#c2410c">VCC</text>
  <text x="733" y="302" text-anchor="end" font-family="system-ui, sans-serif" font-size="12" fill="#495057">GND</text>
  <text x="733" y="318" text-anchor="end" font-family="system-ui, sans-serif" font-size="12" fill="#1d4ed8">DATA</text>

  <!-- ===== Bundle C : OLED (I2C) ===== -->
  <line x1="260" y1="430" x2="740" y2="446" stroke="#c2410c" stroke-width="2"/>
  <line x1="260" y1="446" x2="740" y2="462" stroke="#495057" stroke-width="2"/>
  <line x1="260" y1="462" x2="740" y2="478" stroke="#7c3aed" stroke-width="2"/>
  <line x1="260" y1="478" x2="740" y2="494" stroke="#7c3aed" stroke-width="2" stroke-dasharray="7 4"/>
  <circle cx="260" cy="430" r="4" fill="#c2410c"/>
  <circle cx="260" cy="446" r="4" fill="#495057"/>
  <circle cx="260" cy="462" r="4" fill="#7c3aed"/>
  <circle cx="260" cy="478" r="4" fill="#7c3aed"/>
  <circle cx="740" cy="446" r="4" fill="#c2410c"/>
  <circle cx="740" cy="462" r="4" fill="#495057"/>
  <circle cx="740" cy="478" r="4" fill="#7c3aed"/>
  <circle cx="740" cy="494" r="4" fill="#7c3aed"/>
  <text x="267" y="426" font-family="system-ui, sans-serif" font-size="12" fill="#c2410c">3V3</text>
  <text x="267" y="442" font-family="system-ui, sans-serif" font-size="12" fill="#495057">GND</text>
  <text x="267" y="458" font-family="system-ui, sans-serif" font-size="12" fill="#7c3aed">GPIO21</text>
  <text x="267" y="474" font-family="system-ui, sans-serif" font-size="12" fill="#7c3aed">GPIO22</text>
  <text x="733" y="442" text-anchor="end" font-family="system-ui, sans-serif" font-size="12" fill="#c2410c">VCC</text>
  <text x="733" y="458" text-anchor="end" font-family="system-ui, sans-serif" font-size="12" fill="#495057">GND</text>
  <text x="733" y="474" text-anchor="end" font-family="system-ui, sans-serif" font-size="12" fill="#7c3aed">SDA</text>
  <text x="733" y="490" text-anchor="end" font-family="system-ui, sans-serif" font-size="12" fill="#7c3aed">SCL</text>

  <!-- ===== Bundle D : commande de la pompe (MOSFET cote masse) ===== -->
  <text x="580" y="655" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1a1a1a">Commande de la pompe</text>
  <text x="580" y="672" font-family="system-ui, sans-serif" font-size="12" fill="#495057">MOSFET côté masse</text>

  <!-- ESP32 pins GPIO33 / GND -->
  <circle cx="260" cy="560" r="4" fill="#1d4ed8"/>
  <circle cx="260" cy="590" r="4" fill="#495057"/>
  <text x="267" y="556" font-family="system-ui, sans-serif" font-size="12" fill="#1d4ed8">GPIO33</text>
  <text x="267" y="586" font-family="system-ui, sans-serif" font-size="12" fill="#495057">GND</text>

  <!-- GPIO33 -> R 220 -> gate -->
  <polyline points="260,560 560,560 560,875 620,875" fill="none" stroke="#1d4ed8" stroke-width="2"/>
  <polyline points="620,875 630,867 643,883 656,867 669,883 682,867 695,883 700,875" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <text x="660" y="858" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#1a1a1a">220Ω</text>
  <line x1="700" y1="875" x2="878" y2="875" stroke="#1d4ed8" stroke-width="2"/>
  <circle cx="760" cy="875" r="4" fill="#1d4ed8"/>

  <!-- pull-down 10k gate -> GND -->
  <line x1="760" y1="875" x2="760" y2="895" stroke="#1d4ed8" stroke-width="2"/>
  <polyline points="760,895 752,900 768,910 752,920 768,930 752,940 760,945" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="760" y1="945" x2="760" y2="960" stroke="#495057" stroke-width="2"/>
  <text x="774" y="916" font-family="system-ui, sans-serif" font-size="12" fill="#1a1a1a">10kΩ</text>
  <text x="774" y="931" font-family="system-ui, sans-serif" font-size="11" fill="#495057">pull-down</text>

  <!-- MOSFET N (simplified symbol) -->
  <line x1="878" y1="858" x2="878" y2="892" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="886" y1="853" x2="886" y2="897" stroke="#1a1a1a" stroke-width="2.5"/>
  <polyline points="886,860 900,860 900,820" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <polyline points="886,890 900,890" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <polyline points="900,875 900,890" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="892" y1="875" x2="900" y2="875" stroke="#1a1a1a" stroke-width="2"/>
  <polygon points="887,875 895,870 895,880" fill="#1a1a1a"/>
  <line x1="900" y1="890" x2="900" y2="960" stroke="#495057" stroke-width="2"/>
  <text x="866" y="866" text-anchor="end" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1a1a1a">G</text>
  <text x="907" y="852" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1a1a1a">D</text>
  <text x="907" y="910" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1a1a1a">S</text>
  <text x="922" y="868" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1a1a1a">MOSFET N</text>
  <text x="922" y="884" font-family="system-ui, sans-serif" font-size="11" fill="#495057">logic level</text>
  <text x="922" y="899" font-family="system-ui, sans-serif" font-size="11" fill="#495057">(ex. IRLZ44N)</text>

  <!-- Alimentation pompe -->
  <rect x="760" y="610" width="220" height="80" rx="10" fill="#f8fafc" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="870" y="642" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#1a1a1a">Alimentation pompe</text>
  <text x="870" y="661" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#495057">5V / 12V externe</text>
  <circle cx="900" cy="690" r="4" fill="#c2410c"/>
  <circle cx="960" cy="690" r="4" fill="#495057"/>
  <text x="890" y="684" text-anchor="end" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#c2410c">+</text>
  <text x="950" y="684" text-anchor="end" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#495057">−</text>

  <!-- + -> pompe, diode en parallele -->
  <line x1="900" y1="690" x2="900" y2="744" stroke="#c2410c" stroke-width="2"/>
  <line x1="820" y1="720" x2="900" y2="720" stroke="#c2410c" stroke-width="2"/>
  <circle cx="900" cy="720" r="4" fill="#c2410c"/>

  <circle cx="900" cy="770" r="26" fill="#f8fafc" stroke="#1a1a1a" stroke-width="2"/>
  <text x="900" y="776" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#1a1a1a">M</text>
  <text x="936" y="775" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#1a1a1a">Pompe</text>

  <line x1="900" y1="796" x2="900" y2="820" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="820" y1="820" x2="900" y2="820" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="900" cy="820" r="4" fill="#1a1a1a"/>

  <!-- diode : cathode en haut (vers +), anode en bas (vers drain) -->
  <line x1="820" y1="720" x2="820" y2="762" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="806" y1="762" x2="834" y2="762" stroke="#1a1a1a" stroke-width="2.5"/>
  <polygon points="820,763 808,783 832,783" fill="#1a1a1a"/>
  <line x1="820" y1="783" x2="820" y2="820" stroke="#1a1a1a" stroke-width="2"/>
  <text x="800" y="768" text-anchor="end" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1a1a1a">Diode de roue libre</text>
  <text x="800" y="784" text-anchor="end" font-family="system-ui, sans-serif" font-size="11" fill="#495057">(ex. 1N4007 / 1N5819)</text>
  <text x="800" y="799" text-anchor="end" font-family="system-ui, sans-serif" font-size="11" fill="#495057">cathode côté +</text>

  <!-- − alimentation pompe -> masse commune -->
  <polyline points="960,690 960,700 1015,700 1015,960" fill="none" stroke="#495057" stroke-width="2"/>

  <!-- Masse commune -->
  <polyline points="260,590 520,590 520,960 1015,960" fill="none" stroke="#495057" stroke-width="2"/>
  <circle cx="760" cy="960" r="4" fill="#495057"/>
  <circle cx="900" cy="960" r="4" fill="#495057"/>
  <text x="540" y="984" font-family="system-ui, sans-serif" font-size="12" fill="#495057">Masse commune : GND de l'ESP32 relié au − de l'alimentation de la pompe</text>

  <!-- Legend -->
  <text x="40" y="690" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1a1a1a">Légende</text>
  <line x1="40" y1="710" x2="75" y2="710" stroke="#c2410c" stroke-width="2"/>
  <text x="82" y="714" font-family="system-ui, sans-serif" font-size="12" fill="#1a1a1a">Alimentation (3V3 / + pompe)</text>
  <line x1="40" y1="732" x2="75" y2="732" stroke="#495057" stroke-width="2"/>
  <text x="82" y="736" font-family="system-ui, sans-serif" font-size="12" fill="#1a1a1a">Masse (GND)</text>
  <line x1="40" y1="754" x2="75" y2="754" stroke="#1d4ed8" stroke-width="2"/>
  <text x="82" y="758" font-family="system-ui, sans-serif" font-size="12" fill="#1a1a1a">Signal (GPIO)</text>
  <line x1="40" y1="776" x2="75" y2="776" stroke="#7c3aed" stroke-width="2"/>
  <text x="82" y="780" font-family="system-ui, sans-serif" font-size="12" fill="#1a1a1a">Bus I2C : SDA (plein)</text>
  <line x1="40" y1="798" x2="75" y2="798" stroke="#7c3aed" stroke-width="2" stroke-dasharray="7 4"/>
  <text x="82" y="802" font-family="system-ui, sans-serif" font-size="12" fill="#1a1a1a">Bus I2C : SCL (pointillé)</text>
  <line x1="40" y1="820" x2="75" y2="820" stroke="#1a1a1a" stroke-width="2"/>
  <text x="82" y="824" font-family="system-ui, sans-serif" font-size="12" fill="#1a1a1a">Circuit de puissance pompe</text>
</svg>
